name: CI

# Stable required job names for main branch protection: Quality and Browser.
on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Branch and PR checks must not cancel each other; main push/manual runs share a group.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new main push must not interrupt a production upload already in progress.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run required verification
        run: pnpm verify

      - name: Report unit coverage
        run: pnpm test:coverage

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run browser verification
        run: pnpm test:e2e

      - name: Run component lab verification
        run: pnpm test:lab:ci

      - name: Upload browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  production:
    name: Deploy production
    needs: [quality, browser]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.CLOUDFLARE_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://skylu.me
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish and check production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure the production environment account ID}"
          : "${CLOUDFLARE_API_TOKEN:?Configure the production environment API token}"
          pnpm cf:deploy:production

name: CI

# Stable required job names for main branch protection: Quality and Browser.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR updates replace earlier runs; main push/manual runs share a group.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new main push must not interrupt a production upload already in progress.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  selection:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.select.outputs.quality }}
      groups: ${{ steps.select.outputs.groups }}
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - name: Check out repository and PR history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          cache: false
          install: false

      - name: Select checks from the complete PR diff
        id: select
        run: node scripts/plan-ci.ts

  quality:
    name: Quality
    needs: selection
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a valid selection
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          QUALITY_MODE: ${{ needs.selection.outputs.quality }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$QUALITY_MODE" in full|docs) ;; *) exit 1 ;; esac

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run required verification
        if: ${{ needs.selection.outputs.quality == 'full' }}
        run: pnpm verify:ci

      - name: Check repository documentation formatting
        if: ${{ needs.selection.outputs.quality == 'docs' }}
        run: pnpm format:check

  browser-tests:
    name: Browser suite (${{ matrix.suite }})
    needs: selection
    if: ${{ needs.selection.outputs.groups != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.selection.outputs.suites) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: ${{ !matrix.webkit }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium and WebKit
        if: ${{ matrix.webkit }}
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run selected suite
        env:
          CI_BROWSER_GROUPS: ${{ needs.selection.outputs.groups }}
          CI_BROWSER_SUITE: ${{ matrix.suite }}
        run: pnpm test:ci:browser

      - name: Upload browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure-${{ matrix.suite }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser
    needs: [selection, browser-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected browser suite to pass
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          CI_BROWSER_GROUPS: ${{ needs.selection.outputs.groups }}
          SUITES_RESULT: ${{ needs.browser-tests.result }}
        run: |
          test "$SELECTION_RESULT" = success
          test -n "$CI_BROWSER_GROUPS"
          if [ "$CI_BROWSER_GROUPS" = '[]' ]; then
            test "$SUITES_RESULT" = skipped
            echo "Only repository documentation changed; no browser tests needed."
          else
            test "$SUITES_RESULT" = success
          fi

  production:
    name: Deploy production
    needs: [quality, browser]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.CLOUDFLARE_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://skylu.me
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish and check production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure the production environment account ID}"
          : "${CLOUDFLARE_API_TOKEN:?Configure the production environment API token}"
          pnpm cf:deploy:production
